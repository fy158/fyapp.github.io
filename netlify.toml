[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://fylove-loggithubio-production.up.railway.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# API 代理到 Railway
[[redirects]]
  from = "/api/*"
  to = "https://fylove-loggithubio-production.up.railway.app/api/:splat"
  status = 200
  force = true

# 图片优化
[images]
  remote_images = ["https://.*", "http://.*"]

# 缓存静态资源
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
